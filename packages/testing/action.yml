name: Terra test plan
description: Run a repository test plan once with shared suite validation and reporting.
inputs:
  manifest:
    description: Repository-relative JSON test-plan path. Defaults to config/tests.json, then the legacy config/terra-tests.json, tests/tests.json, tests/terra-tests.json, and root paths.
    required: false
    default: ''
  suites:
    description: Optional comma-separated suite names. Empty runs every suite in manifest order.
    required: false
    default: ''
  shared-only:
    description: Run Standards-owned shared checks without repository-specific suites.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Run declared test suites
      shell: bash
      env:
        TEST_RUNNER_MANIFEST: ${{ inputs.manifest }}
        TEST_RUNNER_SUITES: ${{ inputs.suites }}
        TEST_RUNNER_SHARED_ONLY: ${{ inputs.shared-only }}
      run: |
        set -euo pipefail
        args=(run --root "$GITHUB_WORKSPACE")
        if [[ -n "$TEST_RUNNER_MANIFEST" ]]; then
          args+=(--manifest "$TEST_RUNNER_MANIFEST")
        fi
        if [[ -n "$TEST_RUNNER_SUITES" ]]; then
          args+=(--suites "$TEST_RUNNER_SUITES")
        fi
        if [[ "$TEST_RUNNER_SHARED_ONLY" == "true" ]]; then
          args+=(--shared-only)
        fi
        node "$GITHUB_ACTION_PATH/src/cli.mjs" "${args[@]}"
