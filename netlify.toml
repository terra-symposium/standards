[build]
  command = "pnpm exec docs build"
  publish = "dist/docs"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/getting-started"
  to = "/packages/quality/setup/"
  status = 301

[[redirects]]
  from = "/quality/overview"
  to = "/packages/quality/"
  status = 301

