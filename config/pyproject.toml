[project]
name = "terra-standards-quality-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0.3"]

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "interrogate>=1.7.0",
  "mypy>=2.4.1",
  "pydoclint>=0.12.0",
  "ruff>=0.17.4",
  "types-pyyaml>=6.0.12.20261113",
  "vulture>=2.16",
]

[tool.mypy]
cache_dir = "dist/cache/mypy_cache"

[tool.ruff]
cache-dir = "dist/cache/ruff_cache"
