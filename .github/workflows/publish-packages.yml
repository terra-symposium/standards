name: Publish shared packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://npm.pkg.github.com
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @terra-symposium/quality publish --no-git-checks --access restricted
           env:
             NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - run: pnpm --filter @terra-symposium/error-boundaries publish --no-git-checks --access restricted
           env:
             NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
