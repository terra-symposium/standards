name: Publish shared packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish quality when missing
        working-directory: packages/quality
        run: |
          version=$(node -p "require('./package.json').version")
          npm view "@terra-symposium/standards-quality@$version" version >/dev/null 2>&1 || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish error boundaries when missing
        working-directory: packages/error-boundaries
        run: |
          version=$(node -p "require('./package.json').version")
          npm view "@terra-symposium/standards-error-boundaries@$version" version >/dev/null 2>&1 || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish reporting when missing
        working-directory: packages/reporting
        run: |
          version=$(node -p "require('./package.json').version")
          npm view "@terra-symposium/standards-reporting@$version" version >/dev/null 2>&1 || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
