name: Publish shared packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://npm.pkg.github.com
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish quality when missing
        working-directory: packages/quality
        run: |
          version=$(node -p "require('./package.json').version")
          npm view "@terra-symposium/quality@$version" version >/dev/null 2>&1 || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Publish error boundaries when missing
        working-directory: packages/error-boundaries
        run: |
          version=$(node -p "require('./package.json').version")
          npm view "@terra-symposium/error-boundaries@$version" version >/dev/null 2>&1 || npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
