name: Publish shared packages

on:
  workflow_dispatch:
    inputs:
      docs_ref:
        description: Immutable 40-character Docs commit SHA to publish
        required: true
        default: 53cafba3828c8b241dc2d0e4d271164785d5544d
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish quality when missing
        working-directory: packages/quality
        run: |
          version=$(node -p "require('./package.json').version")
          if ! npm view "@terra-symposium/standards-quality@$version" version >/dev/null 2>&1; then npm publish --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Publish error boundaries when missing
        working-directory: packages/error-boundaries
        run: |
          version=$(node -p "require('./package.json').version")
          if ! npm view "@terra-symposium/standards-error-boundaries@$version" version >/dev/null 2>&1; then npm publish --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Publish reporting when missing
        working-directory: packages/reporting
        run: |
          version=$(node -p "require('./package.json').version")
          if ! npm view "@terra-symposium/standards-reporting@$version" version >/dev/null 2>&1; then npm publish --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Publish testing when missing
        working-directory: packages/testing
        run: |
          version=$(node -p "require('./package.json').version")
          if ! npm view "@terra-symposium/standards-testing@$version" version >/dev/null 2>&1; then npm publish --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - name: Validate Docs source ref
        run: |
          [[ "$DOCS_REF" =~ ^[0-9a-f]{40}$ ]]
        env:
          DOCS_REF: ${{ inputs.docs_ref }}
      - uses: actions/checkout@v7
        with:
          repository: Terra-Symposium/docs
          ref: ${{ inputs.docs_ref }}
          path: docs-source
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: docs-source/config/pnpm-lock.yaml
      - name: Build Docs package
        working-directory: docs-source
        run: |
          pnpm install --frozen-lockfile --lockfile-dir=config
          pnpm build
      - name: Verify Docs package identity
        working-directory: docs-source
        id: docs-package
        run: |
          test "$(node -p "require('./package.json').name")" = "@terra-symposium/docs"
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish Docs when missing
        working-directory: docs-source
        run: |
          version="${{ steps.docs-package.outputs.version }}"
          if ! npm view "@terra-symposium/docs@$version" version >/dev/null 2>&1; then npm publish --access public; fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
