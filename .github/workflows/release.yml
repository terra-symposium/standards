name: Release shared packages

on:
  push:
    branches: [development]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - name: Enable npm trusted publishing
        run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --group dev
      - name: Verify full-repository quality
        run: pnpm run quality:all
      - name: Require committed Quality fixes
        run: git diff --exit-code
      - run: pnpm --filter @terra-symposium/standards-quality test
      - uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm release
          pr-base-branch: development
          pr-title: 'chore: release shared packages'
