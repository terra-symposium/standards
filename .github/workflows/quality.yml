name: Shared package quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --group dev
      - name: Capture full-repository quality findings
        run: pnpm run quality:all -- --report-json standards-quality.json
      - name: Require committed Quality fixes
        run: git diff --exit-code
      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standards-quality
          path: standards-quality.json
          if-no-files-found: warn

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install native test tools
        run: apt-get update && apt-get install -y clang lsof unzip
      - uses: ./packages/testing
        with:
          manifest: config/terra-tests.json

  package:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.30.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: config/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @terra-symposium/standards-testing pack --dry-run
